<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.plan">排课 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#132625">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.plan">🗓️ 排课</div>
  <div class="sub" data-i18n="sub.plan">先修链拓扑排课 · 确定性引擎</div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
  <div class="card">
    <div class="section-title" data-i18n="plan.timeline">🎯 毕业时间线</div>
    <div class="tline-row">
      <label><span data-i18n="plan.years">目标</span>
        <select id="tYears"></select></label>
      <label><span data-i18n="plan.leaveQ">休学</span>
        <input id="tLeave" type="number" min="0" max="6" value="0" class="numin">
        <span data-i18n="plan.qunit">个quarter</span></label>
      <label class="checkwrap"><input type="checkbox" id="tSummer"><span data-i18n="plan.summer">含暑期</span></label>
    </div>
    <div id="tAssess" style="margin-top:10px"></div>
    <p class="hint" data-i18n="plan.assessNote" style="margin-top:8px">压力值为估算（1学分≈每周3小时）；先修链按课程数据计算。</p>
    <p class="hint" data-i18n="plan.certNote" style="margin-top:8px">结论基于目录数据估算：满足要求不代表课程一定开设、有名额，也不代表学校已确认毕业资格；选课前请以 GOLD / 学院官网复核。</p>
    <p class="hint" id="statusLine" style="margin-top:8px"></p>
  </div>
  <div class="card">
    <div class="section-title"><span data-i18n="plan.myTitle">📋 我的选课</span>（<span id="cnt">0</span> <span data-i18n="plan.unitCourses">门</span>）</div>
    <div id="myList"></div>
    <div class="field"><label for="maxU" data-i18n="plan.maxU">每 quarter 学分上限</label>
      <select id="maxU"></select></div>
    <div class="btn-row">
      <button class="btn" id="genBtn" data-i18n="plan.gen">⚡ 生成排课</button>
      <button class="btn ghost" id="clearBtn" data-i18n="plan.clear">清空</button>
    </div>
  </div>
  <div id="goalTips"></div>
  <div id="out"></div>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">查课</span></a>
  <a href="major.html" data-page="major"><span class="ico">🎓</span><span data-i18n="nav.major">专业</span></a>
  <a href="ge.html" data-page="ge"><span class="ico">📖</span><span data-i18n="nav.ge">通识</span></a>
  <a href="plan.html" data-page="plan" class="active"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
  <a href="trajectory.html" data-page="trajectory"><span class="ico">🛤️</span><span data-i18n="nav.traj">轨迹</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script src="js/chat.js"></script>
<script src="js/planner.js"></script>
<script>
"use strict";
function fmtWarnings() {
  return {
    missingPrereq: function (code, list) {
      return I18N.t("warn.missingPrereq", { code: code, list: list.join(I18N.t("warn.listSep")) });
    },
    noRoom: function (code, n) {
      return I18N.t("warn.noRoom", { code: code, n: n });
    }
  };
}
/* ---- 课表草稿箱：点选课程 → 点学期头移动，自动校验先修 ---- */
var DRAFT = null, DRAFT_SEL = null;
function draftUnits(codes) {
  var mine = Sget("myCourses", []);
  return codes.reduce(function (s, code) {
    var m = mine.filter(function (x) { return normCode(x.code) === normCode(code); })[0];
    return s + (m ? parseUnits(m.u) : 4);
  }, 0);
}
function validateDraft() {
  var mine = Sget("myCourses", []), have = Sget("have", {});
  var pos = {};
  DRAFT.forEach(function (q, i) { q.forEach(function (c) { pos[normCode(c)] = i; }); });
  var viol = [];
  mine.forEach(function (c) {
    var ck = normCode(c.code);
    if (pos[ck] === undefined || have[ck]) return;
    (c.pre || []).forEach(function (p) {
      var pk = normCode(p);
      if (have[pk]) return;
      if (pos[pk] !== undefined && pos[pk] >= pos[ck]) viol.push({ code: c.code, pre: p });
    });
  });
  return viol;
}
function renderDraft() {
  var box = document.getElementById("out");
  var terms = [I18N.t("plan.fall"), I18N.t("plan.winter"), I18N.t("plan.spring")];
  var U = I18N.t("courses.units");
  var viol = validateDraft();
  var violSet = {};
  viol.forEach(function (v) { violSet[normCode(v.code)] = v.pre; });
  var h = '<div class="card"><div class="section-title">' + esc(I18N.t("plan.draftTitle")) + '</div>' +
    '<p class="hint">' + esc(I18N.t("plan.draftHint")) + '</p>';
  h += DRAFT.map(function (codes, i) {
    var head = I18N.t("plan.year", { y: Math.floor(i / 3) + 1 }) + " " + terms[i % 3] +
      " · " + draftUnits(codes) + " " + U;
    var chips = codes.map(function (c) {
      var bad = violSet[normCode(c)];
      return '<button class="dchip' + (DRAFT_SEL === c ? " sel" : "") + (bad ? " bad" : "") + '" data-c="' + esc(c) + '">' +
        esc(c) + (bad ? " ⚠️" : "") + '</button>';
    }).join("");
    return '<div class="qblock" data-q="' + i + '"><h4 data-qhead="' + i + '" style="cursor:pointer">' + esc(head) +
      (DRAFT_SEL ? ' <span class="tag">' + esc(I18N.t("plan.moveHere")) + '</span>' : "") + '</h4>' +
      '<div class="dchips">' + (chips || '<span class="hint">—</span>') + '</div></div>';
  }).join("");
  if (viol.length) h += viol.map(function (v) {
    return '<div class="warn">⚠️ ' + esc(I18N.t("plan.prereqViol", { code: v.code, pre: v.pre })) + '</div>';
  }).join("");
  h += '<div class="btn-row"><button class="btn sm" id="copyDraftBtn">' + esc(I18N.t("plan.copyDraft")) + '</button></div>' +
    '<div class="footnote">' + esc(I18N.t("plan.draftNote")) + '</div></div>';
  box.innerHTML = h;
  box.querySelectorAll(".dchip").forEach(function (b) {
    b.addEventListener("click", function () {
      DRAFT_SEL = (DRAFT_SEL === b.dataset.c) ? null : b.dataset.c;
      renderDraft();
    });
  });
  box.querySelectorAll("[data-qhead]").forEach(function (hd) {
    hd.addEventListener("click", function () {
      if (!DRAFT_SEL) return;
      var to = +hd.dataset.qhead;
      DRAFT.forEach(function (q) {
        var ix = q.indexOf(DRAFT_SEL);
        if (ix >= 0) q.splice(ix, 1);
      });
      DRAFT[to].push(DRAFT_SEL);
      DRAFT_SEL = null;
      Sset("draft", DRAFT);
      renderDraft();
    });
  });
  document.getElementById("copyDraftBtn").addEventListener("click", function () {
    var lines = [I18N.t("plan.draftExportHead", { campus: Sget("campus", "") })];
    DRAFT.forEach(function (codes, i) {
      if (!codes.length) return;
      lines.push(I18N.t("plan.year", { y: Math.floor(i / 3) + 1 }) + " " + terms[i % 3] +
        " (" + draftUnits(codes) + "u): " + codes.join(", "));
    });
    var text = lines.join("\n");
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () {
      alert(I18N.t("plan.copied"));
    });
  });
}
function renderMine() {
  var mine = Sget("myCourses", []);
  var campus = Sget("campus", "UCI");
  document.getElementById("cnt").textContent = mine.length;
  var box = document.getElementById("myList");
  var U = I18N.t("courses.units");
  /* 旧校区课程打标（H1 下游兜底）：换校区已统一清理，这里只处理历史存量 */
  var hasForeign = mine.some(function (c) { return c.campus && c.campus !== campus; });
  var head = hasForeign
    ? '<div class="btn-row" style="margin:0 0 8px"><button class="btn ghost sm" id="clearForeignBtn">' +
      esc(I18N.t("common.clearForeign")) + '</button></div>'
    : "";
  box.innerHTML = head + (mine.length ? mine.map(function (c, i) {
    var ftag = (c.campus && c.campus !== campus)
      ? '<span class="tag" style="background:#fee2e2;color:#991b1b">' + esc(I18N.t("common.foreignTag")) + " · " + esc(c.campus) + "</span>"
      : "";
    return '<div class="course-row"><span><b>' + esc(c.code) + '</b><span class="tag">' + esc(c.u) + ' ' + esc(U) + '</span>' + ftag + '</span><button class="btn ghost sm" data-i="' + i + '">' + esc(I18N.t("plan.remove")) + '</button></div>';
  }).join("") : '<p class="hint">' + esc(I18N.t("plan.empty")) + '</p>' +
    (Sget("major", "")
      ? '<div class="btn-row"><a class="btn" href="major.html">' + esc(I18N.t("plan.goMajor")) + '</a></div>'
      : '<div class="btn-row"><a class="btn" href="index.html">' + esc(I18N.t("plan.goIndex")) + '</a></div>'));
  var cfb = document.getElementById("clearForeignBtn");
  if (cfb) cfb.addEventListener("click", function () {
    var m = Sget("myCourses", []).filter(function (c) { return !c.campus || c.campus === campus; });
    Sset("myCourses", m);
    var keep = {};
    m.forEach(function (c) { keep[normCode(c.code)] = true; });
    var nd = Sget("draft", []).map(function (q) {
      return q.filter(function (code) { return keep[normCode(code)]; });
    });
    Sset("draft", nd);
    if (DRAFT) { DRAFT = nd; if (m.length) renderDraft(); else { DRAFT = null; document.getElementById("out").innerHTML = ""; } }
    renderMine();
    renderTimeline();
  });
  box.querySelectorAll("button[data-i]").forEach(function (b) {
    b.addEventListener("click", function () {
      var m = Sget("myCourses", []);
      var removed = m.splice(+b.dataset.i, 1)[0];
      Sset("myCourses", m);
      /* 删一门只从草稿摘除这一门（M3），其余手工排课成果保留 */
      if (removed) {
        var rk = normCode(removed.code);
        var nd = Sget("draft", []).map(function (q) {
          return q.filter(function (code) { return normCode(code) !== rk; });
        });
        Sset("draft", nd);
        if (DRAFT) {
          DRAFT = nd;
          if (m.length) renderDraft();
          else { DRAFT = null; document.getElementById("out").innerHTML = ""; }
        }
      }
      renderMine();
      renderTimeline();
    });
  });
}
function renderStatusLine() {
  var st = statusState();
  var el = document.getElementById("statusLine");
  if (!el) return;
  function fmt(at) { try { return new Date(at).toLocaleString(); } catch (e) { return at; } }
  if (st.state === "ok") {
    el.textContent = I18N.t("status.stateOk", { t: fmt(st.at) });
  } else if (st.state === "stale") {
    el.innerHTML = esc(I18N.t("status.stateStale", { t: fmt(st.at) })) +
      ' <a href="status.html">' + esc(I18N.t("status.goCheck")) + "</a>";
  } else {
    el.innerHTML = esc(I18N.t("status.stateNone")) +
      ' <a href="status.html">' + esc(I18N.t("status.goCheck")) + "</a>";
  }
}
function renderTips() {
  var g = Sget("goal", "undecided");
  var tips = I18N.t("tips." + g);
  if (!tips || !tips.length) { g = "undecided"; tips = I18N.t("tips.undecided"); }
  var name = I18N.t("tips.names." + g);
  document.getElementById("goalTips").innerHTML = '<div class="card"><div class="section-title">' + esc(name) + ' · ' + esc(I18N.t("plan.strategy")) + '</div>'
    + tips.map(function (x) { return '<div class="tip">' + esc(x) + '</div>'; }).join("") + '</div>';
}
/* 用课程搜索索引补全先修/学分（专业页加入的课程缺 pre）；空清单或无需补全时跳过加载 */
function enrichCourses() {
  var mine0 = Sget("myCourses", []);
  var need = mine0.some(function (m) { return !m.pre || !m.pre.length; });
  if (!mine0.length || !need) return Promise.resolve(mine0);
  var campus = Sget("campus", "UCI").toLowerCase();
  return fetch("data/search/" + campus + "/manifest.json").then(function (r) { return r.json(); }).then(function (m) {
    return Promise.all(m.files.map(function (f) {
      return fetch("data/search/" + campus + "/" + f).then(function (r) { return r.json(); });
    }));
  }).then(function (parts) {
    var map = {};
    parts.forEach(function (p) { p.forEach(function (c) { map[normCode(c.code)] = c; }); });
    var mine = Sget("myCourses", []), changed = false;
    mine.forEach(function (m) {
      var e = map[normCode(m.code)];
      if (e) {
        if (!m.pre || !m.pre.length) { m.pre = e.pre || []; changed = true; }
        if (!m.u || m.u === "4") { m.u = e.u; changed = true; }
      }
    });
    if (changed) Sset("myCourses", mine);
    return mine;
  }).catch(function () { return Sget("myCourses", []); });
}
function renderTimeline() {
  var box = document.getElementById("tAssess");
  var mine = Sget("myCourses", []);
  if (!mine.length) { box.innerHTML = '<p class="hint">' + esc(I18N.t("plan.tEmpty")) + '</p>'; return; }
  var years = +document.getElementById("tYears").value || 4;
  var leave = Math.max(0, +document.getElementById("tLeave").value || 0);
  var summer = document.getElementById("tSummer").checked;
  var q = years * 3 - leave + (summer ? years : 0);
  if (q < 1) q = 1;
  var cp = criticalPath(mine);
  var units = mine.reduce(function (s, c) { return s + parseUnits(c.u); }, 0);
  var pace = units / q;
  var maxU = +document.getElementById("maxU").value || 16;
  var hrs = Math.round(pace * 3);
  var free = Math.round(168 - 56 - pace * 3);
  var v, vk;
  if (cp.minQuarters > q) { v = "infeasible"; vk = "plan.verdict_infeasible"; }
  else if (pace > maxU || hrs > 60) { v = "tight"; vk = "plan.verdict_tight"; }
  else { v = "feasible"; vk = "plan.verdict_feasible"; }
  var h = '<div class="tverdict ' + v + '">' + esc(I18N.t(vk)) + '</div>';
  /* 口径声明（H3）：结论只针对已选子集，必须醒目交代，并给学位总量对照 */
  h += '<div class="warn">' + esc(I18N.t("plan.scopeNote", { n: mine.length })) + '</div>';
  h += '<div class="tstat">' + esc(I18N.t("plan.coverageLine", { u: Math.round(units), p: Math.min(100, Math.round(units / 180 * 100)) })) + '</div>';
  h += '<div class="tstat">' + esc(I18N.t("plan.statLine", { n: mine.length, u: Math.round(units), q: cp.minQuarters })) + '</div>';
  h += '<div class="tstat">' + esc(I18N.t("plan.paceLine", { y: years, q: q, p: pace.toFixed(1) })) + '</div>';
  h += '<div class="tstat">' + esc(I18N.t("plan.hoursLine", { h: hrs, f: free })) + '</div>';
  if (cp.chain.length > 1) h += '<div class="tstat hint">' + esc(I18N.t("plan.bottleneck")) + esc(cp.chain.join(" → ")) + '</div>';
  box.innerHTML = h;
}
I18N.init().then(function () {
  I18N.initSwitcher("langSel");
  navActive("plan");
  renderStatusLine();
  var U = I18N.t("courses.units");
  document.getElementById("maxU").innerHTML = [16, 19, 12].map(function (v) {
    return '<option value="' + v + '">' + v + ' ' + esc(U) + '</option>';
  }).join("");
  /* 学分上限持久化：轨迹页自动排课读同一个值（K5 两页统一） */
  document.getElementById("maxU").value = String(Sget("maxUnits", 16));
  document.getElementById("maxU").addEventListener("change", function () {
    Sset("maxUnits", +this.value);
    renderTimeline();
  });
  /* 时间线选择器 */
  var TY = document.getElementById("tYears");
  TY.innerHTML = [2, 3, 4].map(function (y) {
    return '<option value="' + y + '"' + (y === 4 ? " selected" : "") + '>' + esc(I18N.t("plan.yr" + y)) + '</option>';
  }).join("");
  ["tYears", "tLeave", "tSummer"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", renderTimeline);
  });
  document.getElementById("genBtn").addEventListener("click", function () {
    var mine = Sget("myCourses", []);
    if (!mine.length) {
      /* 空清单原地提示（L5）：不再无声跳页，下方空状态自带去向 */
      alert(I18N.t("plan.genEmpty"));
      document.getElementById("myList").scrollIntoView({ behavior: "smooth" });
      return;
    }
    var r = scheduleQuarters(mine, +document.getElementById("maxU").value, 12, fmtWarnings());
    DRAFT = r.quarters.map(function (q) { return q.courses.slice(); });
    DRAFT_SEL = null;
    Sset("draft", DRAFT);
    renderDraft();
    if (r.warnings.length) {
      var box = document.getElementById("out");
      box.insertAdjacentHTML("beforeend", r.warnings.map(function (w) {
        return '<div class="warn">⚠️ ' + esc(w) + '</div>';
      }).join(""));
    }
    document.getElementById("out").scrollIntoView({ behavior: "smooth" });
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    if (confirm(I18N.t("plan.confirmClear"))) { Sset("myCourses", []); Sset("draft", []); DRAFT = null; renderMine(); renderTimeline(); document.getElementById("out").innerHTML = ""; }
  });
  enrichCourses().then(function () {
    renderMine(); renderTips(); renderTimeline();
    var d = Sget("draft", null);
    if (d && d.length) { DRAFT = d; renderDraft(); }
  });
});
</script>
</body>
</html>
