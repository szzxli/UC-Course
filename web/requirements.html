<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.requirements">毕业要求 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#132625">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.requirements">🎓 毕业要求</div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
<div class="seg">
    <button data-seg="major" data-i18n="req.segMajor">专业要求</button>
    <button data-seg="ge" data-i18n="req.segGe">通识要求</button>
  </div>
<section id="sec-major">
<p class="hint" id="majorSub"></p>

  <div id="importBanner" class="alert" hidden></div>
  <div id="majorMismatch" class="card" hidden>
    <p class="hint" id="mismatchText"></p>
    <div class="btn-row"><a class="btn" href="index.html" data-i18n="major.goHome">去首页选择</a></div>
  </div>
  <div id="noMajor" class="card" hidden>
    <p class="hint" data-i18n="major.noMajor">先去首页选择意向专业</p>
    <div class="btn-row"><a class="btn" href="index.html" data-i18n="major.goHome">去首页选择</a></div>
  </div>
  <div id="mSeg" class="seg" hidden>
    <button data-v="m1" class="on"></button><button data-v="m2"></button><button data-v="overlap"></button>
  </div>
  <p class="hint" data-i18n="major.countNote">计数口径：要求卡上的数字 = 已修 + 已加入清单；只有标记“这门我有了”才算已修，加入清单仅表示计划修读。同一门课出现在多项要求中时，页面按要求分别计数，是否可重复计算以学院规定为准，请与学术顾问确认。</p>
  <div id="reqList"></div>
  <div class="btn-row" id="addAllRow" hidden><button class="btn" id="addAllReqBtn" data-i18n="major.addAllRequired">一键加入全部必修课</button></div>
  <div class="btn-row" id="goPlanRow" hidden><a class="btn" href="plan.html" data-i18n="major.goPlan">去排课 →</a></div>
  <div class="btn-row" id="engineRow" hidden><a class="btn" href="plan.html#engine" data-i18n="major.goEngine">智能排课引擎 →</a></div>
  <div class="btn-row" id="pickRow" hidden><a class="btn ghost" href="courses.html#pick" data-i18n="major.goPick">智能选课 →</a></div>
  <div class="btn-row" id="statusRow" hidden><a class="btn ghost" href="status.html" data-i18n="major.goStatus">学业状态核验 →</a></div>
  <div class="btn-row"><a class="btn ghost" href="#" id="goGeBtn" data-i18n="major.goGe">查看本校通识与毕业要求 →</a></div>
  <div class="footnote" id="srcNote"></div>

<div id="selBar" class="selbar" hidden>
  <span id="selCount"></span>
  <button class="btn sm" id="addSelBtn" data-i18n="major.addSelected">加入选课清单</button>
</div>
<div id="eqPop" class="pop" hidden>
  <div class="pop-card">
    <div class="section-title" id="eqTitle"></div>
    <div id="eqBody"></div>
    <div class="btn-row">
      <button class="btn sm" id="eqHaveBtn" data-i18n="major.haveItBtn">这门我有了</button>
      <button class="btn ghost sm" id="eqClose" data-i18n="major.close">关闭</button>
    </div>
  </div>
</div>
</section>
<section id="sec-ge" hidden>
<p class="hint" id="geSub"></p>

  <div class="card">
    <div class="field"><label for="campusSel" data-i18n="courses.campusLabel">校区</label>
      <select id="campusSel">
        <option value="UCI">UC Irvine</option>
        <option value="UCSD">UC San Diego</option>
        <option value="UCSB">UC Santa Barbara</option>
      </select></div>
  </div>
  <div id="noData" class="card" hidden>
    <p class="hint" data-i18n="ge.noData">本校通识数据尚未入库（目前只有 UCSB）</p>
    <div class="btn-row"><a class="btn" href="index.html" data-i18n="ge.goHome">去首页选择</a></div>
  </div>
  <div id="geBody"></div>
  <div class="card" id="engineCard" hidden>
    <p class="hint" data-i18n="ge.engineDesc">说几年毕业，自动按先修链排好学期表（试点：UCSB 环境科学）。</p>
    <div class="btn-row"><a class="btn" href="plan.html#engine" data-i18n="ge.goEngine">智能排课引擎 →</a></div>
  </div>
  <div class="footnote" id="geSrcNote"></div>

</section>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">选课</span></a>
  <a href="requirements.html" data-page="requirements"><span class="ico">🎓</span><span data-i18n="nav.requirements">毕业要求</span></a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script src="js/chat.js"></script>
<script src="js/major.js"></script>
<script src="js/engine.js"></script>
<script>
(function(){

"use strict";
I18N.init().then(function () {
  var campus = Sget("campus", "UCI"), file = Sget("major", ""), file2 = Sget("major2", "");
  /* 转学分导入的一次性反馈横幅（M2）：transfer 页写入 justImported，本页展示后即清 */
  (function () {
    var ji = Sget("justImported", null);
    if (ji === null) return;
    Sset("justImported", null);
    var b = document.getElementById("importBanner");
    b.textContent = I18N.t(ji > 0 ? "major.importBannerN" : "major.importBanner0", { n: ji });
    b.hidden = false;
  })();
  if (!file) { document.getElementById("noMajor").hidden = false; return; }
  document.getElementById("goPlanRow").hidden = false;
  document.getElementById("statusRow").hidden = false;
  if (campus === "UCSB" && file === "ucsb-environmental-science.json") {
    document.getElementById("engineRow").hidden = false;
    document.getElementById("pickRow").hidden = false;
  }
  document.getElementById("addAllRow").hidden = false;
  var MD1 = null, MD2 = null, EQUIV = {}, VIEW = "m1";
  var SELECTED = {};
  var EXPANDED = {}, COLLAPSED = {};
  var HAVE = Sget("have", {});
  function saveHave() { Sset("have", HAVE); }
  function inHave(k) { return !!HAVE[normCode(k)]; }
  function refreshBar() {
    var n = Object.keys(SELECTED).length;
    document.getElementById("selBar").hidden = n === 0;
    document.body.classList.toggle("has-selbar", n > 0);
    document.getElementById("selCount").textContent = I18N.t("major.selectedN", { n: n });
  }
  function refreshStates() {
    var mine = Sget("myCourses", []);
    document.querySelectorAll(".course-row[data-k]").forEach(function (row) {
      var k = row.dataset.k, cb = row.querySelector('input[type="checkbox"]');
      var haveTag = row.querySelector(".havetag"), haveBtn = row.querySelector("[data-havebtn]");
      var inPlan = mine.some(function (x) { return normCode(x.code) === k; });
      var had = inHave(k);
      row.classList.toggle("had", had);
      if (cb) { cb.disabled = had || inPlan; if (had || inPlan) cb.checked = true; else if (!SELECTED[k]) cb.checked = false; }
      if (haveTag) haveTag.hidden = !had;
      if (haveBtn) {
        haveBtn.textContent = had ? I18N.t("major.unhave") : I18N.t("major.haveBtn");
        haveBtn.classList.toggle("on", had);
      }
      var planTag = row.querySelector(".plantag");
      if (planTag) planTag.hidden = !(inPlan && !had);
    });
    document.querySelectorAll("[data-req]").forEach(function (card) {
      var keys = JSON.parse(card.dataset.keys || "[]");
      /* 进度口径（K3）：已修 ∪ 已加入清单，两套计数互通，不再只认 have */
      var planned = {};
      mine.forEach(function (x) { planned[normCode(x.code)] = true; });
      var n = keys.filter(function (k) { return inHave(k) || planned[k]; }).length;
      var el = card.querySelector("[data-havecount]");
      if (el) el.textContent = I18N.t("major.progressCount", { n: n, m: keys.length });
      /* 折叠：默认全部收起，点标题展开；已完成卡仍标 ✓ 已完成；手动状态优先于默认状态 */
      var groups = JSON.parse(card.dataset.groups || "[]");
      var covered = function (k) { return inHave(k) || planned[k]; };
      var done = false;
      if (keys.length) {
        if (card.dataset.etype !== "elective" && groups.length) {
          var inGrp = {};
          groups.forEach(function (g) { g.forEach(function (c) { inGrp[c] = true; }); });
          var flat = keys.filter(function (k) { return !inGrp[k]; });
          done = flat.length ? keys.every(covered) : groups.some(function (g) { return g.length && g.every(covered); });
        } else {
          done = keys.every(covered);
        }
      }
      var dt = card.querySelector("[data-donetag]");
      if (dt) dt.hidden = !done;
      var bd = card.querySelector(".reqbody");
      var fm = card.querySelector("[data-foldmark]");
      if (bd) {
        var ri = card.dataset.req;
        if (EXPANDED[ri]) bd.hidden = false;
        else if (COLLAPSED[ri]) bd.hidden = true;
        else bd.hidden = true;
        if (fm) fm.textContent = bd.hidden ? "▸" : "▾";
      }
    });
  }
  function courseRowHTML(c, extraNote) {
    var k = normCode(c), eq = EQUIV[k] || { ap: [], cc: [] };
    var badges = (eq.ap.length ? '<span class="ebadge" data-eq="' + esc(c) + '">AP</span>' : "") +
      (eq.cc.length ? '<span class="ebadge cc" data-eq="' + esc(c) + '">CC</span>' : "");
    return '<div class="course-row" data-k="' + esc(k) + '">' +
      '<label class="checkwrap"><input type="checkbox" data-k="' + esc(k) + '" data-code="' + esc(c) + '"><a href="#" class="link" data-chain="' + esc(c) + '">' + esc(c) + '</a>' + badges +
      '<span class="tag havetag" hidden>' + esc(I18N.t("major.haveTag")) + '</span>' +
      '<span class="tag plantag" hidden>' + esc(I18N.t("major.inPlan")) + '</span></label>' +
      (extraNote ? '<span class="hint">' + esc(extraNote) + '</span>' : "") +
      '<button class="btn ghost sm" data-havebtn data-k="' + esc(k) + '">' + esc(I18N.t("major.haveBtn")) + '</button></div>';
  }
  /* 中文层（H2）：zh 界面优先显示 name_zh/note_zh，要求名中英并排；
     长备注的 note_zh 是中文摘要，英文原文附后（>200 字符时） */
  function isZh() { var l = I18N.getLocale(); return l === "zh-CN" || l === "zh-TW"; }
  function reqDisplayName(req) { return (isZh() && req.name_zh) ? req.name_zh : req.name; }
  function reqTitleHTML(req) {
    if (isZh() && req.name_zh) {
      return esc(req.name_zh) + ' <span class="hint" style="font-weight:400">' + esc(req.name) + "</span>";
    }
    return esc(req.name);
  }
  function reqNoteHTML(req) {
    if (!req.note) return "";
    if (isZh() && req.note_zh) {
      var h = '<p class="hint">' + esc(req.note_zh) + "</p>";
      if (req.note.length > 200) h += '<p class="hint" style="font-size:12px">' + esc(req.note) + "</p>";
      return h;
    }
    return '<p class="hint">' + esc(req.note) + "</p>";
  }
  function reqAllCourses(req) {
    var s = {};
    (req.courses || []).forEach(function (c) { s[normCode(c)] = c; });
    (req.options || []).forEach(function (g) { g.forEach(function (c) { s[normCode(c)] = c; }); });
    return Object.keys(s).map(function (k) { return s[k]; });
  }
  function reqCardHTML(req, ri) {
    var badge = I18N.t(REQ_TYPE_BADGE[req.type] || "major.reqRequired");
    var countLine = (req.type === "elective" && req.count) ? " · " + I18N.t("major.pickCount", { n: req.count }) : "";
    var keys = reqAllCourses(req).map(normCode);
    /* 去重：已出现在备选组里的课只在组里出现一次，不再平铺重复（“两组选一”类要求此前上下各出现一次） */
    var optCourses = {};
    (req.options || []).forEach(function (g) { g.forEach(function (c) { optCourses[normCode(c)] = true; }); });
    var body = (req.courses || []).filter(function (c) { return !optCourses[normCode(c)]; }).map(function (c) { return courseRowHTML(c); }).join("");
    (req.options || []).forEach(function (g, gi) {
      body += '<div class="optgroup"><div class="opthead"><span class="tag">' +
        esc(I18N.t("major.optLabel", { n: String.fromCharCode(65 + gi) })) + '</span> ' +
        '<a href="#" class="link" data-pickopt="' + ri + ':' + gi + '">' + esc(I18N.t("major.pickThis")) + '</a></div>' +
        g.map(function (c) { return courseRowHTML(c); }).join("") + '</div>';
    });
    if (!body) body = '<p class="hint">' + esc(I18N.t("major.openPool", { n: req.count || 0 })) + '</p>';
    var selAll = (req.courses || []).length
      ? ' <a href="#" class="link" data-selall="' + ri + '">' + esc(I18N.t("major.selectAll")) + '</a>' : "";
    return '<div class="card" data-req="' + ri + '" data-keys=\'' + JSON.stringify(keys) + '\' data-groups=\'' + JSON.stringify((req.options || []).map(function (g) { return g.map(normCode); })) + '\' data-etype="' + esc(req.type || "") + '">' +
      '<div class="section-title">' + reqTitleHTML(req) +
      ' <span class="tag">' + esc(badge) + countLine + '</span>' +
      (keys.length ? ' <span class="tag have" data-havecount></span>' : "") +
      ' <span class="tag done" data-donetag hidden>✓ ' + esc(I18N.t("major.doneTag")) + '</span>' + selAll +
      ' <span class="foldmark" data-foldmark>▾</span></div>' +
      '<div class="reqbody">' + reqNoteHTML(req) + body + '</div></div>';
  }
  function overlapList() {
    function reqSet(md) {
      var s = {};
      (md.requirements || []).forEach(function (r) {
        reqAllCourses(r).forEach(function (c) {
          var k = normCode(c);
          (s[k] = s[k] || { code: c, reqs: [] }).reqs.push(reqDisplayName(r));
        });
      });
      return s;
    }
    var s1 = reqSet(MD1), s2 = reqSet(MD2);
    return Object.keys(s1).filter(function (k) { return s2[k]; }).map(function (k) {
      return { code: s1[k].code, r1: s1[k].reqs, r2: s2[k].reqs };
    });
  }
  function renderView() {
    var box = document.getElementById("reqList");
    document.querySelectorAll("#mSeg button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.v === VIEW);
    });
    var h = "";
    if (VIEW === "overlap" && MD2) {
      var ov = overlapList();
      h = '<div class="card"><div class="section-title">' + esc(I18N.t("major.overlapTitle", { n: ov.length })) + '</div>' +
        '<p class="hint">' + esc(I18N.t("major.overlapHint")) + '</p>' +
        (ov.length ? ov.map(function (o) {
          return courseRowHTML(o.code, MD1.major + ": " + o.r1.join("; ") + " ｜ " + MD2.major + ": " + o.r2.join("; "));
        }).join("") : '<p class="hint">' + esc(I18N.t("major.overlapNone")) + '</p>') + '</div>';
    } else {
      var md = VIEW === "m2" && MD2 ? MD2 : MD1;
      h = (md.requirements || []).map(function (req, ri) { return reqCardHTML(req, ri); }).join("");
    }
    box.innerHTML = h;
    wireRows(box);
    refreshStates();
  }
  function wireRows(box) {
    box.querySelectorAll('input[type="checkbox"][data-k]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        if (cb.checked) SELECTED[cb.dataset.k] = cb.dataset.code;
        else delete SELECTED[cb.dataset.k];
        refreshBar();
      });
    });
    box.querySelectorAll(".ebadge").forEach(function (b) {
      b.addEventListener("click", function (e) { e.preventDefault(); openPopup(b.dataset.eq); });
    });
    box.querySelectorAll("[data-chain]").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); openPopup(a.dataset.chain); });
    });
    box.querySelectorAll("[data-havebtn]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var k = btn.dataset.k;
        if (inHave(k)) delete HAVE[k]; else HAVE[k] = true;
        saveHave(); refreshStates();
      });
    });
    box.querySelectorAll("[data-selall]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        box.querySelector('[data-req="' + a.dataset.selall + '"]')
          .querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(function (cb) {
            if (!cb.checked) { cb.checked = true; SELECTED[cb.dataset.k] = cb.dataset.code; }
          });
        refreshBar();
      });
    });
    box.querySelectorAll("[data-pickopt]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var parts = a.dataset.pickopt.split(":"), ri = parts[0], gi = +parts[1];
        var card = box.querySelector('[data-req="' + ri + '"]');
        var groups = card.querySelectorAll(".optgroup");
        card.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          delete SELECTED[cb.dataset.k]; cb.checked = false;
        });
        groups[gi].querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(function (cb) {
          cb.checked = true; SELECTED[cb.dataset.k] = cb.dataset.code;
        });
        refreshBar();
      });
    });
    /* 卡片折叠：点标题展开/收起（标题里的链接除外），手动状态优先于默认收起状态 */
    box.querySelectorAll("[data-req]").forEach(function (card) {
      var t = card.querySelector(".section-title");
      if (!t) return;
      t.addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        var bd = card.querySelector(".reqbody");
        if (!bd) return;
        var ri = card.dataset.req;
        bd.hidden = !bd.hidden;
        if (bd.hidden) { COLLAPSED[ri] = true; delete EXPANDED[ri]; }
        else { EXPANDED[ri] = true; delete COLLAPSED[ri]; }
        var fm = card.querySelector("[data-foldmark]");
        if (fm) fm.textContent = bd.hidden ? "▸" : "▾";
      });
    });
  }
  /* 解释链：课程 → 满足的要求 → 先修条件 → 后续影响 → 当前状态。
     先修/后续数据只来自试点引擎目录（UCSB-ES、UCSD Math-CS）；非试点专业如实标注未入库，不编。 */
  var PILOT_ENG = {
    "ucsb-environmental-science.json": "data/engine/ucsb-es.json",
    "ucsd-mathematics-computer-science.json": "data/engine/ucsd-mathcs.json"
  };
  var ENG_CACHE = {};
  function engCatalogFor(file, cb) {
    var url = PILOT_ENG[file];
    if (!url) { cb(null); return; }
    if (ENG_CACHE[url]) { cb(ENG_CACHE[url]); return; }
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var cat = {};
      (j.courses || []).forEach(function (c) { cat[Engine.normCode(c.code)] = c; });
      var down = {};
      Object.keys(cat).forEach(function (code) {
        var t = Engine.parsePrereq(cat[code].prerequisites_raw || "");
        if (t && t.fallback) {
          var flat = (cat[code].prerequisites_courses || []).map(Engine.normCode);
          t = flat.length ? { op: "OR", items: flat.map(function (c) { return { code: c }; }) } : null;
        }
        if (!t) return;
        Engine.treeLeafCodes(t, []).forEach(function (leaf) {
          (down[leaf] = down[leaf] || []).push(code);
        });
      });
      ENG_CACHE[url] = { cat: cat, down: down };
      cb(ENG_CACHE[url]);
    }).catch(function () { cb(null); });
  }
  function renderTree(node, set) {
    if (!node) return "";
    if (node.code) {
      var k = Engine.normCode(node.code);
      return (set.has(k) ? "✓ " : "✗ ") + node.code;
    }
    var join = node.op === "OR" ? " 或 " : " 且 ";
    var inner = node.items.map(function (x) { return renderTree(x, set); }).join(join);
    return node.items.length > 1 ? "（" + inner + "）" : inner;
  }
  function fillChain(code) {
    var box = document.getElementById("chainBox");
    if (!box) return;
    var k = normCode(code);
    var mine = Sget("myCourses", []);
    var haveSet = new Set(Object.keys(HAVE).map(Engine.normCode));
    var plannedSet = new Set(mine.map(function (x) { return Engine.normCode(x.code); }));
    var bothSet = new Set(Array.from(haveSet).concat(Array.from(plannedSet)));
    var mds = [MD1].concat(MD2 ? [MD2] : []);
    var reqLines = [];
    mds.forEach(function (md) {
      (md.requirements || []).forEach(function (r) {
        if (reqAllCourses(r).map(normCode).indexOf(k) >= 0) {
          reqLines.push((mds.length > 1 ? reqDisplayName(r) + "（" + (isZh() ? (md.major_zh || md.major) : md.major) + "）" : reqDisplayName(r)));
        }
      });
    });
    var h = '<div class="section-title">' + esc(I18N.t("major.chainTitle")) + '</div>';
    h += '<p class="hint">' + esc(I18N.t("major.chainReqs")) + '：' +
      (reqLines.length ? esc(reqLines.join("、")) : esc(I18N.t("major.chainReqNone"))) + '</p>';
    var stateText = inHave(k) ? I18N.t("major.chainHave")
      : (plannedSet.has(k) ? I18N.t("major.chainPlanned") : "");
    var pilot = null;
    mds.forEach(function (md) { if (md && PILOT_ENG[md.file]) pilot = md; });
    function finish(preHTML, downHTML) {
      box.innerHTML = h + preHTML + downHTML +
        (stateText ? '<p class="hint">' + esc(I18N.t("major.chainState")) + '：' + esc(stateText) + '</p>' : '');
    }
    if (!pilot) {
      finish('<p class="hint">' + esc(I18N.t("major.chainNoData")) + '</p>', '');
      return;
    }
    engCatalogFor(pilot.file, function (eng) {
      if (!eng) {
        finish('<p class="hint">' + esc(I18N.t("major.chainLoadFail")) + '</p>', '');
        return;
      }
      var cat = eng.cat, entry = cat[k] || {};
      var t = Engine.parsePrereq(entry.prerequisites_raw || "");
      if (t && t.fallback) {
        var flat = (entry.prerequisites_courses || []).map(Engine.normCode);
        t = flat.length ? { op: "OR", items: flat.map(function (c) { return { code: c }; }) } : null;
      }
      var preHTML = "";
      if (!t) {
        preHTML = '<p class="hint">' + esc(I18N.t("major.chainPre")) + '：' + esc(I18N.t("major.chainNoPre")) + '</p>';
        if (!stateText) stateText = I18N.t("major.chainOk");
      } else {
        preHTML = '<p class="hint">' + esc(I18N.t("major.chainPre")) + '：' + renderTree(t, bothSet) + '</p>';
        if (!stateText) {
          if (Engine.treeSatisfied(t, haveSet)) stateText = I18N.t("major.chainOk");
          else if (Engine.treeSatisfied(t, bothSet)) stateText = I18N.t("major.chainPlannedPre");
          else {
            var miss = Engine.treeLeafCodes(t, []).filter(function (c) { return !bothSet.has(c); });
            stateText = I18N.t("major.chainBlocked") + miss.slice(0, 5).join("、") + (miss.length > 5 ? "…" : "");
          }
        }
      }
      var down = eng.down[k] || [];
      var downHTML = '<p class="hint">' + esc(I18N.t("major.chainDown")) + '：' +
        (down.length ? esc(I18N.t("major.chainDownN", { n: down.length })) + esc(down.slice(0, 8).join("、")) +
          (down.length > 8 ? "…" : "") + (down.length >= 6 ? ' <span class="tag done">🔑 ' + esc(I18N.t("major.chainKey")) + '</span>' : "")
          : esc(I18N.t("major.chainDownNone"))) + '</p>';
      finish(preHTML, downHTML);
    });
  }
  function openPopup(code) {
    var k = normCode(code), eq = EQUIV[k] || { ap: [], cc: [] };
    document.getElementById("eqTitle").textContent = code;
    var h = '<div id="chainBox"><p class="hint">' + esc(I18N.t("major.chainLoading")) + '</p></div>';
    if (eq.ap.length) {
      h += '<div class="section-title">' + esc(I18N.t("major.apSection")) + '</div>' + eq.ap.map(function (a) {
        return '<div class="eqrow"><b>' + esc(a.exam) + '</b> · ' + esc(a.score) + ' → ' +
          esc((a.courses || []).join(", ")) + (a.units ? ' (' + esc(a.units) + 'u)' : "") +
          (a.note ? '<br><span class="hint">' + esc(a.note) + '</span>' : "") + '</div>';
      }).join("");
    }
    if (eq.cc.length) {
      var show = eq.cc.slice(0, 10);
      h += '<div class="section-title">' + esc(I18N.t("major.ccSection")) + '</div>' + show.map(function (m) {
        return '<div class="eqrow">' + esc(m.cc) + ' · <b>' + esc(m.course) + '</b></div>';
      }).join("");
      if (eq.cc.length > 10) h += '<p class="hint">' + esc(I18N.t("major.ccMore", { n: eq.cc.length - 10 })) + '</p>';
    }
    h += '<p class="hint">' + esc(I18N.t("major.equivNote")) + '</p>';
    document.getElementById("eqBody").innerHTML = h;
    fillChain(code);
    var hb = document.getElementById("eqHaveBtn");
    hb.textContent = inHave(k) ? I18N.t("major.unhave") : I18N.t("major.haveItBtn");
    hb.onclick = function () {
      if (inHave(k)) delete HAVE[k]; else HAVE[k] = true;
      saveHave(); refreshStates();
      hb.textContent = inHave(k) ? I18N.t("major.unhave") : I18N.t("major.haveItBtn");
    };
    document.getElementById("eqPop").hidden = false;
  }
  document.getElementById("eqClose").addEventListener("click", function () {
    document.getElementById("eqPop").hidden = true;
  });
  document.getElementById("eqPop").addEventListener("click", function (e) {
    if (e.target.id === "eqPop") e.target.hidden = true;
  });
  document.querySelectorAll("#mSeg button").forEach(function (b) {
    b.addEventListener("click", function () { VIEW = b.dataset.v; SELECTED = {}; refreshBar(); renderView(); });
  });
  var jobs = [fetchMajor(campus, file)];
  if (file2) jobs.push(fetchMajor(campus, file2));
  jobs.push(fetch("data/credits/index.json").then(function (r) { return r.json(); }).catch(function () { return {}; }));
  Promise.all(jobs).then(function (rs) {
    MD1 = rs[0];
    var ci = rs[file2 ? 2 : 1] || {};
    if (file2) MD2 = rs[1];
    var cl = ci[campus] || { ap: [], cc: [] };
    var cjobs = cl.ap.map(function (f) {
      return fetch("data/credits/" + f).then(function (r) { return r.json(); }).catch(function () { return []; });
    }).concat(cl.cc.map(function (f) {
      return fetch("data/credits/" + f).then(function (r) { return r.json(); }).catch(function () { return {}; });
    }));
    return Promise.all(cjobs).then(function (parts) {
      parts.slice(0, cl.ap.length).forEach(function (arr) {
        arr.forEach(function (a) {
          (a.courses || []).forEach(function (c) {
            var k = normCode(c);
            EQUIV[k] = EQUIV[k] || { ap: [], cc: [] };
            EQUIV[k].ap.push(a);
          });
        });
      });
      parts.slice(cl.ap.length).forEach(function (obj) {
        Object.keys(obj).forEach(function (c) {
          var k = normCode(c);
          EQUIV[k] = EQUIV[k] || { ap: [], cc: [] };
          EQUIV[k].cc = EQUIV[k].cc.concat(obj[c]);
        });
      });
      return true;
    });
  }).then(function () {
    /* 校区归属校验（M1）：专业文件自带 campus，与当前校区不符时明示，
       不再拼出「UCI 的专业 · UCSD」这种不存在的组合 */
    if ((MD1.campus && MD1.campus !== campus) || (MD2 && MD2.campus && MD2.campus !== campus)) {
      document.getElementById("mismatchText").textContent =
        I18N.t("major.campusMismatch", { fc: (MD1.campus || "?"), campus: campus });
      document.getElementById("majorMismatch").hidden = false;
      document.getElementById("addAllRow").hidden = true;
      document.getElementById("goPlanRow").hidden = true;
      return;
    }
    document.getElementById("majorSub").textContent =
      MD1.major + " (" + MD1.degree + ")" + (MD2 ? " + " + MD2.major + " (" + MD2.degree + ")" : "") + " · " + campus;
    if (MD2) {
      var seg = document.getElementById("mSeg");
      seg.hidden = false;
      var btns = seg.querySelectorAll("button");
      btns[0].textContent = MD1.major;
      btns[1].textContent = MD2.major;
      btns[2].textContent = I18N.t("major.segOverlap", { n: overlapList().length });
    }
    renderView();
    document.getElementById("srcNote").textContent =
      I18N.t("major.sourceNote", { campus: campus, date: MD1.checked || "" });
  }).catch(function () {
    document.getElementById("reqList").innerHTML = '<div class="card"><p class="hint">load fail</p></div>';
  });
  function addCodes(list) {
    var m = Sget("myCourses", []), added = 0;
    list.forEach(function (c) {
      var k = normCode(c);
      if (inHave(k)) return;
      if (!m.some(function (x) { return normCode(x.code) === k; })) {
        m.push({ code: c, u: "4", pre: [], campus: campus });
        added++;
      }
    });
    Sset("myCourses", m);
    SELECTED = {};
    refreshStates(); refreshBar();
    return added;
  }
  document.getElementById("addAllReqBtn").addEventListener("click", function () {
    if (!MD1) return;
    var list = [], optUsed = 0;
    [MD1, MD2].forEach(function (md) {
      if (!md) return;
      (md.requirements || []).forEach(function (req) {
        if (req.type !== "required") return;
        (req.courses || []).forEach(function (c) { list.push(c); });
        /* 多方案必修取第一组——必须向用户披露（M5），不再静默替选 */
        if (req.options && req.options.length) { req.options[0].forEach(function (c) { list.push(c); }); optUsed++; }
      });
    });
    var msg = I18N.t("major.addedN", { n: addCodes(list) });
    if (optUsed) msg += "\n" + I18N.t("major.addAllNote", { n: optUsed });
    alert(msg);
  });
  document.getElementById("addSelBtn").addEventListener("click", function () {
    var list = Object.keys(SELECTED).map(function (k) { return SELECTED[k]; });
    alert(I18N.t("major.addedN", { n: addCodes(list) }));
  });
});

})();
</script>
<script>
(function(){

"use strict";
var CAMPUS = "UCI";
function isZh() { var l = I18N.getLocale(); return l === "zh-CN" || l === "zh-TW"; }
function reqTitleHTML(req) {
  if (isZh() && req.name_zh) {
    return esc(req.name_zh) + ' <span class="hint" style="font-weight:400">' + esc(req.name) + "</span>";
  }
  return esc(req.name);
}
function reqNoteHTML(req) {
  if (!req.note) return "";
  if (isZh() && req.note_zh) {
    var h = '<p class="hint">' + esc(req.note_zh) + "</p>";
    if (req.note.length > 200) h += '<p class="hint" style="font-size:12px">' + esc(req.note) + "</p>";
    return h;
  }
  return '<p class="hint">' + esc(req.note) + "</p>";
}
function reqTagHTML(req) {
  if (req.count != null) return esc(I18N.t("ge.pickCount", { n: req.count }));
  if ((req.courses || []).length) return esc(I18N.t("ge.required"));
  return esc(I18N.t("ge.byNote"));
}
function reqCardHTML(req) {
  var body = "";
  (req.courses || []).forEach(function (c) { body += '<div class="course-row"><b>' + esc(c) + "</b></div>"; });
  (req.options || []).forEach(function (g, gi) {
    body += '<div class="optgroup"><div class="opthead"><span class="tag">' +
      esc(I18N.t("major.optLabel", { n: String.fromCharCode(65 + gi) })) + "</span></div>" +
      g.map(function (c) { return '<div class="course-row"><b>' + esc(c) + "</b></div>"; }).join("") + "</div>";
  });
  if (!body && req.count != null) body = '<p class="hint">' + esc(I18N.t("ge.openPool", { n: req.count })) + "</p>";
  return '<div class="card ge-card"><div class="section-title ge-head">' + reqTitleHTML(req) +
    ' <span class="tag">' + reqTagHTML(req) + "</span>" +
    ' <span class="foldmark">▸</span></div><div class="gebody" hidden>' + reqNoteHTML(req) + body + "</div></div>";
}
function render(ge) {
  var h = "";
  (ge.sections || []).forEach(function (sec) {
    var title = (isZh() && sec.title_zh) ? sec.title_zh : sec.title;
    h += '<div class="card"><div class="section-title">' + esc(title) + "</div>" +
      (sec.note_zh && isZh() ? '<p class="hint">' + esc(sec.note_zh) + "</p>" : "") +
      (sec.note && (!isZh() || !sec.note_zh) ? '<p class="hint">' + esc(sec.note) + "</p>" : "") + "</div>";
    (sec.requirements || []).forEach(function (req) { h += reqCardHTML(req); });
  });
  document.getElementById("geBody").innerHTML = h;
  document.querySelectorAll("#geBody .ge-head").forEach(function (head) {
    head.addEventListener("click", function () {
      var bd = head.nextElementSibling;
      if (!bd) return;
      bd.hidden = !bd.hidden;
      var fm = head.querySelector(".foldmark");
      if (fm) fm.textContent = bd.hidden ? "▸" : "▾";
    });
  });
  var src = (ge.source_note || "") + " · " + I18N.t("ge.checked", { d: ge.checked || "" });
  if (ge.sources) {
    src += " · " + ge.sources.map(function (s) {
      return '<a class="link" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>";
    }).join(" / ");
  }
  document.getElementById("geSrcNote").innerHTML = src;
  document.getElementById("geSub").textContent = (isZh() && ge.title_zh) ? ge.title_zh : ge.title;
}
function load() {
  fetch("data/ge/" + CAMPUS.toLowerCase() + ".json").then(function (r) {
    if (!r.ok) throw new Error("no data");
    return r.json();
  }).then(function (ge) {
    document.getElementById("noData").hidden = true;
    render(ge);
  }).catch(function () {
    document.getElementById("geBody").innerHTML = "";
    document.getElementById("geSrcNote").textContent = "";
    document.getElementById("geSub").textContent = "";
    document.getElementById("noData").hidden = false;
  });
}
I18N.init().then(function () {
  CAMPUS = Sget("campus", "UCI");
  var csel = document.getElementById("campusSel");
  csel.value = CAMPUS;
  document.getElementById("engineCard").hidden =
    !(CAMPUS === "UCSB" && Sget("major", "") === "ucsb-environmental-science.json");
  csel.addEventListener("change", function () {
    var nv = this.value;
    if (nv === CAMPUS) return;
    if (!switchCampus(nv, I18N.t("common.campusSwitchMsg", { campus: nv }))) {
      this.value = CAMPUS;
      return;
    }
    location.reload();
  });
  load();
});

})();
</script>
<script>
(function(){
  var SEGS = ["major", "ge"];
  function show(id){
    SEGS.forEach(function(s){ document.getElementById("sec-"+s).hidden = (s !== id); });
    document.querySelectorAll("[data-seg]").forEach(function(b){ b.classList.toggle("on", b.dataset.seg === id); });
  }
  function fromHash(){
    var h = (location.hash || "").replace("#", "").split("?")[0];
    return SEGS.indexOf(h) >= 0 ? h : SEGS[0];
  }
  document.querySelectorAll("[data-seg]").forEach(function(b){
    b.addEventListener("click", function(){
      history.replaceState(null, "", "#" + b.dataset.seg);
      show(b.dataset.seg);
    });
  });
  window.addEventListener("hashchange", function(){ show(fromHash()); });
  document.getElementById("goGeBtn").addEventListener("click", function(e){
      e.preventDefault();
      history.replaceState(null, "", "#ge");
      show("ge");
    });
  I18N.init().then(function(){
    I18N.initSwitcher("langSel");
    navActive("requirements");
    show(fromHash());
  });
})();
</script>
