<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.ge">通识与毕业要求 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#132625">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.ge">📖 通识与毕业要求</div>
  <div class="sub" id="geSub"></div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
  <div class="card">
    <div class="field"><label for="campusSel" data-i18n="courses.campusLabel">校区</label>
      <select id="campusSel">
        <option value="UCI">UC Irvine</option>
        <option value="UCSD">UC San Diego</option>
        <option value="UCSB">UC Santa Barbara</option>
      </select></div>
  </div>
  <div class="card" id="ucsdCollegeRow" hidden>
    <div class="field"><label for="collegeSel" data-i18n="ge.ucsdCollegeLabel">学院</label>
      <select id="collegeSel">
        <option value="revelle">Revelle College（Revelle 学院）</option>
        <option value="muir">John Muir College（Muir 学院）</option>
        <option value="marshall">Thurgood Marshall College（Marshall 学院）</option>
        <option value="warren">Earl Warren College（Warren 学院）</option>
        <option value="roosevelt">Eleanor Roosevelt College（Roosevelt 学院）</option>
        <option value="sixth">Sixth College（Sixth 学院）</option>
        <option value="seventh">Seventh College（Seventh 学院）</option>
      </select></div>
    <p class="hint" id="ucsdSharedNote" data-i18n="ge.ucsdSharedNote">校级统一要求（不计入学院通识，七学院共享）：入学写作要求（ELWR）、美国历史与制度（AHI）、多元平等包容（DEI）1 门、气候变化教育（JTCCER）1 门。</p>
  </div>
  <div id="noData" class="card" hidden>
    <p class="hint" data-i18n="ge.noData">本校通识数据尚未入库（目前有 UCSB、UCI、UCSD 七学院）</p>
    <div class="btn-row"><a class="btn" href="index.html" data-i18n="ge.goHome">去首页选择</a></div>
  </div>
  <div id="geBody"></div>
  <div class="card" id="engineCard" hidden>
    <p class="hint" data-i18n="ge.engineDesc">说几年毕业，自动按先修链排好学期表（试点：UCSB 环境科学）。</p>
    <div class="btn-row"><a class="btn" href="engine.html" data-i18n="ge.goEngine">智能排课引擎 →</a></div>
  </div>
  <div class="footnote" id="srcNote"></div>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">选课</span></a>
  <a href="requirements.html" data-page="requirements"><span class="ico">🎓</span><span data-i18n="nav.requirements">毕业要求</span></a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
"use strict";
var CAMPUS = "UCI";
function isZh() { var l = I18N.getLocale(); return l === "zh-CN" || l === "zh-TW"; }
function reqTitleHTML(req) {
  if (isZh() && req.name_zh) {
    return esc(req.name_zh) + ' <span class="hint" style="font-weight:400">' + esc(req.name) + "</span>";
  }
  return esc(req.name);
}
function reqNoteHTML(req) {
  if (!req.note) return "";
  if (isZh() && req.note_zh) {
    var h = '<p class="hint">' + esc(req.note_zh) + "</p>";
    if (req.note.length > 200) h += '<p class="hint" style="font-size:12px">' + esc(req.note) + "</p>";
    return h;
  }
  return '<p class="hint">' + esc(req.note) + "</p>";
}
function reqTagHTML(req) {
  if (req.count != null) return esc(I18N.t("ge.pickCount", { n: req.count }));
  if ((req.courses || []).length) return esc(I18N.t("ge.required"));
  return esc(I18N.t("ge.byNote"));
}
function reqCardHTML(req) {
  var body = "";
  (req.courses || []).forEach(function (c) { body += '<div class="course-row"><b>' + esc(c) + "</b></div>"; });
  (req.options || []).forEach(function (g, gi) {
    body += '<div class="optgroup"><div class="opthead"><span class="tag">' +
      esc(I18N.t("major.optLabel", { n: String.fromCharCode(65 + gi) })) + "</span></div>" +
      g.map(function (c) { return '<div class="course-row"><b>' + esc(c) + "</b></div>"; }).join("") + "</div>";
  });
  if (!body && req.count != null) body = '<p class="hint">' + esc(I18N.t("ge.openPool", { n: req.count })) + "</p>";
  return '<div class="card ge-card"><div class="section-title ge-head">' + reqTitleHTML(req) +
    ' <span class="tag">' + reqTagHTML(req) + "</span>" +
    ' <span class="foldmark">▸</span></div><div class="gebody" hidden>' + reqNoteHTML(req) + body + "</div></div>";
}
function render(ge) {
  var h = "";
  (ge.sections || []).forEach(function (sec) {
    var title = (isZh() && sec.title_zh) ? sec.title_zh : sec.title;
    h += '<div class="card"><div class="section-title">' + esc(title) + "</div>" +
      (sec.note_zh && isZh() ? '<p class="hint">' + esc(sec.note_zh) + "</p>" : "") +
      (sec.note && (!isZh() || !sec.note_zh) ? '<p class="hint">' + esc(sec.note) + "</p>" : "") + "</div>";
    (sec.requirements || []).forEach(function (req) { h += reqCardHTML(req); });
  });
  document.getElementById("geBody").innerHTML = h;
  document.querySelectorAll("#geBody .ge-head").forEach(function (head) {
    head.addEventListener("click", function () {
      var bd = head.nextElementSibling;
      if (!bd) return;
      bd.hidden = !bd.hidden;
      var fm = head.querySelector(".foldmark");
      if (fm) fm.textContent = bd.hidden ? "▸" : "▾";
    });
  });
  var src = (ge.source_note || "") + " · " + I18N.t("ge.checked", { d: ge.checked || "" });
  if (ge.sources) {
    src += " · " + ge.sources.map(function (s) {
      return '<a class="link" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a>";
    }).join(" / ");
  }
  document.getElementById("srcNote").innerHTML = src;
  document.getElementById("geSub").textContent = (isZh() && ge.title_zh) ? ge.title_zh : ge.title;
}
function geFile() {
  if (CAMPUS === "UCSD") return "ucsd-" + Sget("ucsdCollege", "revelle");
  return CAMPUS.toLowerCase();
}
function load() {
  fetch("data/ge/" + geFile() + ".json").then(function (r) {
    if (!r.ok) throw new Error("no data");
    return r.json();
  }).then(function (ge) {
    document.getElementById("noData").hidden = true;
    render(ge);
  }).catch(function () {
    document.getElementById("geBody").innerHTML = "";
    document.getElementById("srcNote").textContent = "";
    document.getElementById("geSub").textContent = "";
    document.getElementById("noData").hidden = false;
  });
}
I18N.init().then(function () {
  I18N.initSwitcher("langSel");
  navActive("ge");
  CAMPUS = Sget("campus", "UCI");
  var csel = document.getElementById("campusSel");
  csel.value = CAMPUS;
  var colRow = document.getElementById("ucsdCollegeRow");
  var colSel = document.getElementById("collegeSel");
  colRow.hidden = (CAMPUS !== "UCSD");
  colSel.value = Sget("ucsdCollege", "revelle");
  colSel.addEventListener("change", function () {
    Sset("ucsdCollege", this.value);
    load();
  });
  document.getElementById("engineCard").hidden =
    !(CAMPUS === "UCSB" && Sget("major", "") === "ucsb-environmental-science.json");
  csel.addEventListener("change", function () {
    var nv = this.value;
    if (nv === CAMPUS) return;
    if (!switchCampus(nv, I18N.t("common.campusSwitchMsg", { campus: nv }))) {
      this.value = CAMPUS;
      return;
    }
    location.reload();
  });
  load();
});
</script>
</body>
</html>
