<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.index">UC 智选 UC SmartPick</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.index">🎓 UC 智选 UC SmartPick</div>
  <div class="sub" data-i18n="sub.index">目标驱动的 UC 选课：读研 / 直博 / 实习，不同目标不同排法</div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
  <div class="card">
    <div class="section-title" data-i18n="index.goalTitle">🎯 先定目标，再选课</div>
    <p class="hint" data-i18n="index.goalHint">同一专业，读研和就业的选课策略完全不同。选一个，排课时会给你不同的建议。</p>
    <div id="goalBox">
      <label class="radio-card"><input type="radio" name="goal" value="grad"><span><b data-i18n="index.grad">📚 读研 / 直博</b><br><span class="hint" data-i18n="index.gradHint">GPA 优先 + research + graduate-level 课</span></span></label>
      <label class="radio-card"><input type="radio" name="goal" value="job"><span><b data-i18n="index.job">💼 实习 / 就业</b><br><span class="hint" data-i18n="index.jobHint">项目课优先 + recruiting 季留白</span></span></label>
      <label class="radio-card"><input type="radio" name="goal" value="undecided"><span><b data-i18n="index.undecided">🤔 还没定</b><br><span class="hint" data-i18n="index.undecidedHint">先按毕业要求排，大二前决定</span></span></label>
    </div>
  </div>
  <div class="card">
    <div class="section-title" data-i18n="index.campusTitle">🏫 你的校区</div>
    <p class="hint" data-i18n="index.campusHint">v0.1 先上两校：UCI、UCSD（课程数据已入库）。</p>
    <div class="field"><select id="campus">
      <option value="UCI">UC Irvine</option>
      <option value="UCSD">UC San Diego</option>
    </select></div>
  </div>
  <div class="card">
    <div class="section-title" data-i18n="index.majorTitle">🎓 意向专业</div>
    <p class="hint" data-i18n="index.majorHint">选了专业，查课和排课会告诉你每门课满足哪条毕业要求。</p>
    <div class="field"><select id="majorSel"><option value="" data-i18n="index.noMajor">暂不选专业</option></select></div>
  </div>
  <div class="btn-row">
    <a class="btn" href="courses.html" id="goBtn">开始选课 →</a>
  </div>
  <div class="footnote" data-i18n="index.footnote">v0.1：课程搜索 + 先修链排课。UCLA/UCB/UCSB 数据管线进行中。</div>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index" class="active"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">查课</span></a>
  <a href="major.html" data-page="major"><span class="ico">🎓</span><span data-i18n="nav.major">专业</span></a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
"use strict";
I18N.init().then(function () {
  I18N.initSwitcher("langSel");
  navActive("index");
  var MAJORS = [];
  function updateGoBtn() {
    var hasMajor = !!document.getElementById("majorSel").value;
    var btn = document.getElementById("goBtn");
    btn.href = hasMajor ? "major.html" : "courses.html";
    btn.textContent = I18N.t(hasMajor ? "index.goMajor" : "index.go");
  }
  function fillMajors(campus) {
    var sel = document.getElementById("majorSel");
    var cur = Sget("major", "");
    sel.innerHTML = '<option value="">' + I18N.t("index.noMajor") + "</option>";
    MAJORS.filter(function (m) { return m.campus === campus; }).forEach(function (m) {
      var o = document.createElement("option");
      o.value = m.file;
      o.textContent = m.major + " (" + m.degree + ")";
      sel.appendChild(o);
    });
    sel.value = cur;
    updateGoBtn();
  }
  fetch("data/majors/index.json").then(function (r) { return r.json(); }).then(function (j) {
    MAJORS = j;
    fillMajors(document.getElementById("campus").value);
  });
  document.getElementById("campus").addEventListener("change", function () {
    fillMajors(this.value);
    Sset("major", "");
  });
  (function () {
    var g = Sget("goal", null), c = Sget("campus", "UCI");
    if (g) { var r = document.querySelector('input[name="goal"][value="' + g + '"]'); if (r) { r.checked = true; r.closest(".radio-card").classList.add("sel"); } }
    document.getElementById("campus").value = c;
  })();
  document.querySelectorAll('input[name="goal"]').forEach(function (r) {
    r.addEventListener("change", function () {
      document.querySelectorAll(".radio-card").forEach(function (x) { x.classList.remove("sel"); });
      r.closest(".radio-card").classList.add("sel");
      Sset("goal", r.value);
    });
  });
  document.getElementById("goBtn").addEventListener("click", function () {
    var g = document.querySelector('input[name="goal"]:checked');
    Sset("goal", g ? g.value : "undecided");
    Sset("campus", document.getElementById("campus").value);
    Sset("major", document.getElementById("majorSel").value);
  });
  document.getElementById("majorSel").addEventListener("change", function () {
    Sset("major", this.value);
    updateGoBtn();
  });
});
</script>
</body>
</html>
