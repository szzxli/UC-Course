<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>查课 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">🔍 查课</div>
  <div class="sub" id="campusSub">UC Irvine · 5,843 门</div>
</div></div>
<div class="page">
  <div class="card">
    <div class="field"><label for="q">搜索课程（代码或标题）</label>
      <input type="text" id="q" placeholder="如 CSE 12 / data structures" autocomplete="off"></div>
    <div id="results"></div>
  </div>
  <div class="card" id="detailCard" hidden>
    <div class="section-title" id="dTitle"></div>
    <div id="dBody"></div>
    <div class="btn-row"><button class="btn sm" id="addBtn">＋ 加入我的选课</button></div>
  </div>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span>首页</a>
  <a href="courses.html" data-page="courses" class="active"><span class="ico">🔍</span>查课</a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span>排课</a>
</nav>
<script src="js/app.js"></script>
<script>
"use strict";
navActive("courses");
var CAMPUS = Sget("campus", "UCI");
var INDEX = [], cur = null;
document.getElementById("campusSub").textContent = (CAMPUS === "UCI" ? "UC Irvine · 5,843 门" : "UC San Diego · 6,761 门");
fetch("data/search/" + CAMPUS.toLowerCase() + "/manifest.json").then(function (r) { return r.json(); }).then(function (m) {
  return Promise.all(m.files.map(function (f) {
    return fetch("data/search/" + CAMPUS.toLowerCase() + "/" + f).then(function (r) { return r.json(); });
  }));
}).then(function (parts) {
  parts.forEach(function (p) { INDEX = INDEX.concat(p); });
  document.getElementById("q").addEventListener("input", doSearch);
  doSearch();
}).catch(function () {
  document.getElementById("results").innerHTML = '<p class="hint">数据加载失败</p>';
});
function doSearch() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  var box = document.getElementById("results");
  if (q.length < 2) { box.innerHTML = '<p class="hint">输入至少 2 个字符开始搜索</p>'; return; }
  var hits = INDEX.filter(function (c) {
    return c.code.toLowerCase().indexOf(q) >= 0 || c.t.toLowerCase().indexOf(q) >= 0;
  }).slice(0, 30);
  box.innerHTML = hits.length ? hits.map(function (c, i) {
    return '<div class="course-row"><span><b>' + esc(c.code) + '</b> ' + esc(c.t) + '<span class="tag">' + esc(c.u) + ' units</span></span><button class="btn ghost sm" data-i="' + INDEX.indexOf(c) + '">详情</button></div>';
  }).join("") : '<p class="hint">没找到，换个关键词试试</p>';
  box.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { showDetail(INDEX[+b.dataset.i]); });
  });
}
function showDetail(c) {
  cur = c;
  document.getElementById("detailCard").hidden = false;
  document.getElementById("dTitle").textContent = c.code + " · " + c.t;
  /* 从分块文件取完整描述 */
  fetch("data/raw/" + c.f).then(function (r) { return r.json(); }).then(function (arr) {
    var full = null;
    for (var i = 0; i < arr.length; i++) if (arr[i].code === c.code) { full = arr[i]; break; }
    var h = '<p class="hint">' + esc(c.u) + ' units · ' + esc(c.d) + '</p>';
    if (full && full.description) h += '<p style="font-size:14px;margin:8px 0">' + esc(full.description) + '</p>';
    if (full && full.prerequisites_raw) h += '<p style="font-size:14px"><b>先修：</b>' + esc(full.prerequisites_raw) + '</p>';
    else if (c.pre && c.pre.length) h += '<p style="font-size:14px"><b>先修：</b>' + esc(c.pre.join("、")) + '</p>';
    else h += '<p class="hint">无先修要求</p>';
    document.getElementById("dBody").innerHTML = h;
  });
  document.getElementById("detailCard").scrollIntoView({ behavior: "smooth" });
}
document.getElementById("addBtn").addEventListener("click", function () {
  if (!cur) return;
  var mine = Sget("myCourses", []);
  if (!mine.some(function (x) { return x.code === cur.code; })) {
    mine.push({ code: cur.code, u: cur.u, pre: cur.pre || [], campus: CAMPUS });
    Sset("myCourses", mine);
  }
  alert(cur.code + " 已加入选课（" + mine.length + " 门）");
});
</script>
</body>
</html>
