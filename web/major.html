<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.major">专业 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.major">🎓 专业毕业要求</div>
  <div class="sub" id="majorSub"></div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
  <div id="noMajor" class="card" hidden>
    <p class="hint" data-i18n="major.noMajor">先去首页选择意向专业</p>
    <div class="btn-row"><a class="btn" href="index.html" data-i18n="major.goHome">去首页选择</a></div>
  </div>
  <div id="reqList"></div>
  <div class="btn-row" id="addAllRow" hidden><button class="btn" id="addAllReqBtn" data-i18n="major.addAllRequired">一键加入全部必修课</button></div>
  <div class="btn-row" id="goPlanRow" hidden><a class="btn" href="plan.html" data-i18n="major.goPlan">去排课 →</a></div>
  <div class="footnote" id="srcNote"></div>
</div>
<div id="selBar" class="selbar" hidden>
  <span id="selCount"></span>
  <button class="btn sm" id="addSelBtn" data-i18n="major.addSelected">加入选课清单</button>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">查课</span></a>
  <a href="major.html" data-page="major" class="active"><span class="ico">🎓</span><span data-i18n="nav.major">专业</span></a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script src="js/major.js"></script>
<script>
"use strict";
I18N.init().then(function () {
  I18N.initSwitcher("langSel");
  navActive("major");
  var campus = Sget("campus", "UCI"), file = Sget("major", "");
  if (!file) { document.getElementById("noMajor").hidden = false; return; }
  document.getElementById("goPlanRow").hidden = false;
  document.getElementById("addAllRow").hidden = false;
  var MAJORDATA = null;
  var SELECTED = {}; /* normCode -> code */
  function refreshBar() {
    var n = Object.keys(SELECTED).length;
    document.getElementById("selBar").hidden = n === 0;
    document.body.classList.toggle("has-selbar", n > 0);
    document.getElementById("selCount").textContent = I18N.t("major.selectedN", { n: n });
  }
  function markInPlan() {
    var m = Sget("myCourses", []);
    document.querySelectorAll('input[type="checkbox"][data-k]').forEach(function (cb) {
      var inPlan = m.some(function (x) { return normCode(x.code) === cb.dataset.k; });
      var lbl = cb.closest("label").querySelector("span");
      var old = lbl.querySelector(".tag");
      if (inPlan) {
        cb.checked = true; cb.disabled = true;
        if (!old) { var t = document.createElement("span"); t.className = "tag"; t.textContent = I18N.t("major.inPlan"); lbl.appendChild(t); }
      } else {
        cb.disabled = false;
        if (old) old.remove();
        if (!SELECTED[cb.dataset.k]) cb.checked = false;
      }
    });
  }
  fetchMajor(campus, file).then(function (md) {
    MAJORDATA = md;
    document.getElementById("majorSub").textContent = md.major + " (" + md.degree + ") · " + campus;
    var box = document.getElementById("reqList");
    box.innerHTML = (md.requirements || []).map(function (req, ri) {
      var badge = I18N.t(REQ_TYPE_BADGE[req.type] || "major.reqRequired");
      var countLine = (req.type === "elective" && req.count) ? " · " + I18N.t("major.pickCount", { n: req.count }) : "";
      var selAll = (req.courses || []).length
        ? ' <a href="#" class="link" data-selall="' + ri + '">' + esc(I18N.t("major.selectAll")) + '</a>' : "";
      var courses = (req.courses || []).map(function (c) {
        var k = normCode(c);
        return '<label class="course-row check"><input type="checkbox" data-k="' + esc(k) +
          '" data-code="' + esc(c) + '"><span><b>' + esc(c) + '</b></span></label>';
      }).join("");
      if (!courses) courses = '<p class="hint">' + esc(req.note || "") + '</p>';
      return '<div class="card" data-req="' + ri + '"><div class="section-title">' + esc(req.name) +
        ' <span class="tag">' + esc(badge) + countLine + '</span>' + selAll + '</div>' +
        (req.note ? '<p class="hint">' + esc(req.note) + '</p>' : "") + courses + '</div>';
    }).join("");
    box.querySelectorAll('input[type="checkbox"][data-k]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        if (cb.checked) SELECTED[cb.dataset.k] = cb.dataset.code;
        else delete SELECTED[cb.dataset.k];
        refreshBar();
      });
    });
    box.querySelectorAll("[data-selall]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        box.querySelector('[data-req="' + a.dataset.selall + '"]')
          .querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(function (cb) {
            if (!cb.checked) { cb.checked = true; SELECTED[cb.dataset.k] = cb.dataset.code; }
          });
        refreshBar();
      });
    });
    markInPlan();
    document.getElementById("srcNote").textContent =
      I18N.t("major.sourceNote", { campus: campus, date: md.checked || "" });
  }).catch(function () {
    document.getElementById("reqList").innerHTML = '<div class="card"><p class="hint">load fail</p></div>';
  });
  document.getElementById("addAllReqBtn").addEventListener("click", function () {
    if (!MAJORDATA) return;
    var m = Sget("myCourses", []), added = 0;
    (MAJORDATA.requirements || []).forEach(function (req) {
      if (req.type !== "required") return;
      (req.courses || []).forEach(function (c) {
        var k = normCode(c);
        if (!m.some(function (x) { return normCode(x.code) === k; })) {
          m.push({ code: c, u: "4", pre: [], campus: campus });
          added++;
        }
      });
    });
    Sset("myCourses", m);
    SELECTED = {};
    markInPlan();
    refreshBar();
    alert(I18N.t("major.addedN", { n: added }));
  });
  document.getElementById("addSelBtn").addEventListener("click", function () {    var m = Sget("myCourses", []), added = 0;
    Object.keys(SELECTED).forEach(function (k) {
      if (!m.some(function (x) { return normCode(x.code) === k; })) {
        m.push({ code: SELECTED[k], u: "4", pre: [], campus: campus });
        added++;
      }
    });
    Sset("myCourses", m);
    SELECTED = {};
    markInPlan();
    refreshBar();
    alert(I18N.t("major.addedN", { n: added }));
  });
});
</script>
</body>
</html>
