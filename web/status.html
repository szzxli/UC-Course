<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.status">学业状态核验 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#132625">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.status">✅ 学业状态核验</div>
  <div class="sub" data-i18n="sub.status">确认一次，之后所有排课都按这份状态算</div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
  <div class="card">
    <div class="section-title" data-i18n="status.baseTitle">基本信息</div>
    <p class="hint" id="baseRows"></p>
  </div>
  <div class="card">
    <div class="section-title" data-i18n="status.haveTitle">已修与转学分</div>
    <p class="hint" id="haveRows"></p>
    <p class="hint" data-i18n="status.ccNote">导入的课程已计入已修。</p>
  </div>
  <div class="card" id="remindCard" hidden>
    <div class="section-title" data-i18n="status.remindTitle">待确认</div>
    <div id="remindRows"></div>
  </div>
  <div class="card">
    <div class="section-title" data-i18n="status.confirmTitle">确认</div>
    <p class="hint" id="stateText"></p>
    <div class="btn-row"><button class="btn" id="confirmBtn"></button></div>
  </div>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">选课</span></a>
  <a href="major.html" data-page="major"><span class="ico">🎓</span><span data-i18n="nav.major">专业</span></a>
  <a href="ge.html" data-page="ge"><span class="ico">📖</span><span data-i18n="nav.ge">通识</span></a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
  <a href="trajectory.html" data-page="trajectory"><span class="ico">🛤️</span><span data-i18n="nav.traj">进度</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
"use strict";
var CAMPUS_NAMES = { UCI: "UC Irvine", UCSD: "UC San Diego", UCSB: "UC Santa Barbara" };
function majorLabel(m) {
  var l = I18N.getLocale();
  if (l === "zh-CN" && m.major_zh) return m.major_zh;
  if (l === "zh-TW" && m.major_tw) return m.major_tw;
  return m.major;
}
function fmtTime(at) {
  try { return new Date(at).toLocaleString(); } catch (e) { return at; }
}
function render(MAJORS) {
  var fp = statusFingerprint();
  var st = statusState();
  function label(f) {
    if (!f) return "";
    var m = MAJORS.filter(function (x) { return x.file === f; })[0];
    return m ? majorLabel(m) + " (" + m.degree + ")" : f;
  }
  var rows = [
    I18N.t("status.campusLabel") + "：" + (CAMPUS_NAMES[fp.campus] || fp.campus),
    I18N.t("status.majorLabel") + "：" + (label(fp.major) || I18N.t("status.noMajor")),
    I18N.t("status.major2Label") + "：" + (label(fp.major2) || I18N.t("status.noMajor2")),
    I18N.t("status.goalLabel") + "：" + I18N.t("tips.names." + fp.goal)
  ];
  document.getElementById("baseRows").innerHTML = rows.map(function (r) { return esc(r); }).join("<br>");
  var have = Sget("have", {});
  var codes = Object.keys(have || {}).sort();
  var haveLine = I18N.t("status.haveCount", { n: codes.length });
  if (codes.length) haveLine += "：" + esc(codes.join("、"));
  else haveLine += "（" + I18N.t("status.haveNone") + "）";
  document.getElementById("haveRows").innerHTML = haveLine + "<br>" +
    esc(I18N.t("status.ccLabel") + "：" + (fp.transferCC || I18N.t("status.ccNone")));
  var reminds = [];
  if (!fp.major) reminds.push('<p class="hint">' + esc(I18N.t("status.remindMajor")) +
    ' <a href="index.html">' + esc(I18N.t("status.goHome")) + "</a></p>");
  if (!codes.length) reminds.push('<p class="hint">' + esc(I18N.t("status.remindHave")) +
    ' <a href="major.html">' + esc(I18N.t("status.goMajor")) + "</a></p>");
  document.getElementById("remindCard").hidden = !reminds.length;
  document.getElementById("remindRows").innerHTML = reminds.join("");
  var stateText = document.getElementById("stateText");
  var btn = document.getElementById("confirmBtn");
  if (st.state === "ok") {
    stateText.textContent = I18N.t("status.stateOk", { t: fmtTime(st.at) });
    btn.textContent = I18N.t("status.reconfirmBtn");
  } else if (st.state === "stale") {
    stateText.textContent = I18N.t("status.stateStale", { t: fmtTime(st.at) });
    btn.textContent = I18N.t("status.reconfirmBtn");
  } else {
    stateText.textContent = I18N.t("status.stateNone");
    btn.textContent = I18N.t("status.confirmBtn");
  }
}
I18N.init().then(function () {
  I18N.initSwitcher("langSel");
  navActive("status");
  fetch("data/majors/index.json").then(function (r) { return r.json(); }).then(function (j) {
    render(j);
  }, function () { render([]); });
  document.getElementById("confirmBtn").addEventListener("click", function () {
    Sset("statusCheck", { at: new Date().toISOString(), fp: statusFingerprint() });
    fetch("data/majors/index.json").then(function (r) { return r.json(); }).then(function (j) {
      render(j);
    }, function () { render([]); });
  });
});
</script>
</body>
</html>
