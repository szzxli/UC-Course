<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title.engine">智能排课引擎 · UC 智选</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#132625">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand" data-i18n="brand.engine">🧠 智能排课引擎</div>
  <div class="sub" id="engSub"></div>
  <div><select id="langSel" class="langsel" aria-label="language"></select></div>
</div></div>
<div class="page">
  <div class="card">
    <p class="hint" data-i18n="engine.pilotNote">试点：仅支持 UCSB 环境科学（B.S.）。夏季学期、UC Online 与社区大学课不在本版，属后续期次。</p>
    <div class="field"><label for="yearsIn" data-i18n="engine.yearsLabel">目标毕业年数</label>
      <input type="number" id="yearsIn" value="3" min="2" max="6" step="1"></div>
    <div class="field"><label for="capIn" data-i18n="engine.capLabel">每学期最大学分</label>
      <input type="number" id="capIn" value="20" min="12" max="24" step="1"></div>
    <div class="field"><label for="startSel" data-i18n="engine.startLabel">起始学期</label>
      <select id="startSel">
        <option value="0" data-i18n="engine.fall">秋季</option>
        <option value="1" data-i18n="engine.winter">冬季</option>
        <option value="2" data-i18n="engine.spring">春季</option>
      </select></div>
    <div class="field"><label class="checkwrap"><input type="checkbox" id="langChk">
      <span data-i18n="engine.langLabel">外语需在 UCSB 修课（+3 门，学位总学分 184）</span></label></div>
    <p class="hint" id="haveNote"></p>
    <div class="btn-row"><button class="btn" id="runBtn" data-i18n="engine.runBtn">生成排课 →</button></div>
  </div>
  <div id="result"></div>
</div>
<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span><span data-i18n="nav.home">首页</span></a>
  <a href="courses.html" data-page="courses"><span class="ico">🔍</span><span data-i18n="nav.courses">查课</span></a>
  <a href="major.html" data-page="major"><span class="ico">🎓</span><span data-i18n="nav.major">专业</span></a>
  <a href="ge.html" data-page="ge"><span class="ico">📖</span><span data-i18n="nav.ge">通识</span></a>
  <a href="plan.html" data-page="plan"><span class="ico">🗓️</span><span data-i18n="nav.plan">排课</span></a>
  <a href="trajectory.html" data-page="trajectory"><span class="ico">🛤️</span><span data-i18n="nav.traj">轨迹</span></a>
</nav>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script>
"use strict";
var MAJOR = null, CATALOG = {};
function isZh() { var l = I18N.getLocale(); return l === "zh-CN" || l === "zh-TW"; }
function termLabel(i, startTerm) {
  var year = Math.floor(i / 3) + 1;
  var q = (startTerm + i) % 3;
  var qName = [I18N.t("engine.fall"), I18N.t("engine.winter"), I18N.t("engine.spring")][q];
  return I18N.t("engine.yearLabel", { y: year }) + " " + qName;
}
function getHave() {
  var h = Sget("have", {});
  if (Array.isArray(h)) return h.map(Engine.normCode);
  return Object.keys(h || {}).map(Engine.normCode);
}
function render(plan, input) {
  var box = document.getElementById("result");
  var h = "";
  if (plan.feasible) {
    var avg = (plan.totalUnits / plan.terms.length).toFixed(1);
    h += '<div class="card"><div class="section-title">' +
      esc(I18N.t("engine.verdictOk", { y: plan.years })) + "</div>" +
      '<p class="hint">' + esc(I18N.t("engine.totalLine", { t: plan.totalUnits, n: plan.terms.length, a: avg })) + "</p></div>";
  } else {
    h += '<div class="card"><div class="section-title">' + esc(I18N.t("engine.verdictFail")) + "</div>" +
      '<p class="hint">' + esc(I18N.t("engine.failDetail", {
        u: plan.unscheduled.length, extra: plan.extraTerms, cp: plan.criticalPathTerms, ml: plan.minTermsByLoad
      })) + "</p>" +
      '<p class="hint">' + esc(plan.unscheduled.slice(0, 12).join("、")) + "</p></div>";
  }
  plan.terms.forEach(function (t, i) {
    if (!t.courses.length) return;
    h += '<div class="card"><div class="section-title">' + esc(termLabel(i, input.startTerm)) +
      ' <span class="tag">' + esc(I18N.t("engine.termUnits", { u: t.units })) + "</span></div>";
    t.courses.forEach(function (c) {
      h += '<div class="course-row"><b>' + esc(c.code) + "</b> <span class=\"hint\">" + esc(c.units) +
        (c.generic ? " · " + esc(I18N.t("engine.genericTag")) : "") +
        (c.key ? " · 🔑 " + esc(I18N.t("engine.keyTag")) : "") + "</span></div>";
    });
    h += "</div>";
  });
  if (plan.keyCourses.length) {
    h += '<div class="card"><div class="section-title">' + esc(I18N.t("engine.keyTitle")) + "</div>";
    plan.keyCourses.slice(0, 12).forEach(function (k) {
      h += '<div class="course-row"><b>' + esc(k.code) + "</b> <span class=\"hint\">" +
        esc(I18N.t("engine.keyDetail", { f: k.fanout, t: termLabel(k.term, input.startTerm) })) + "</span></div>";
    });
    h += "</div>";
  }
  h += '<div class="card"><div class="section-title">' + esc(I18N.t("engine.coverageMajor")) + "</div>";
  plan.coverage.major.forEach(function (r) {
    h += '<p class="hint"><b>' + esc(r.name) + "</b>：' + esc(r.courses.join("、")) + "</p>";
  });
  h += "</div>";
  h += '<div class="card"><div class="section-title">' + esc(I18N.t("engine.coverageGe")) + "</div>";
  plan.coverage.ge.forEach(function (r) {
    h += '<p class="hint"><b>' + esc(r.name) + "</b>：' + esc(r.courses.join("、")) + "</p>";
  });
  h += "</div>";
  h += '<div class="card"><div class="section-title">' + esc(I18N.t("engine.warningsTitle")) + "</div>";
  plan.warnings.forEach(function (w) { h += '<p class="hint">· ' + esc(w) + "</p>"; });
  h += "</div>";
  box.innerHTML = h;
}
I18N.init().then(function () {
  I18N.initSwitcher("langSel");
  document.getElementById("engSub").textContent = "UCSB Environmental Studies (B.S.)";
  var have = getHave();
  document.getElementById("haveNote").textContent =
    I18N.t("engine.haveNote", { n: have.length });
  Promise.all([
    fetch("data/majors/ucsb-environmental-science.json").then(function (r) { return r.json(); }),
    fetch("data/engine/ucsb-es.json").then(function (r) { return r.json(); })
  ]).then(function (parts) {
    MAJOR = parts[0];
    parts[1].courses.forEach(function (c) { CATALOG[Engine.normCode(c.code)] = c; });
    document.getElementById("runBtn").addEventListener("click", function () {
      var input = {
        years: parseInt(document.getElementById("yearsIn").value, 10) || 3,
        maxUnits: parseInt(document.getElementById("capIn").value, 10) || 20,
        startTerm: parseInt(document.getElementById("startSel").value, 10) || 0,
        langAtUCSB: document.getElementById("langChk").checked,
        have: have
      };
      var plan = Engine.buildPlan(input, { major: MAJOR, catalog: CATALOG });
      render(plan, input);
    });
  });
});
</script>
</body>
</html>
